plugins {
    id 'java'
}

// You can change the version as you update your tool
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    // This pulls in the Montoya API for compilation.
    // Using compileOnly ensures it isn't packaged into your final JAR, as Burp provides it at runtime.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
}

java {
    // Burp Suite runs on modern Java; 17 is the current standard.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    // This sets the name of the final .jar file
    archiveBaseName.set('FastScopeManager')
}